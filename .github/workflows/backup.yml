name: Backup Archive

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate backup archive
        run: npm run backup

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: autriders-backup-${{ github.run_number }}
          path: backups/*.tar.gz
          if-no-files-found: error
